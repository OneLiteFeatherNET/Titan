      light_blue_wool: 1
      yellow_wool: 1
      lime_wool: 1
      pink_wool: 1
      gray_wool: 1
      light_gray_wool: 1
      cyan_wool: 1
      purple_wool: 1
      blue_wool: 1
      brown_wool: 1
      green_wool: 1
      red_wool: 1
