# The "jumprun" module: the random single-player jump and run.
jumprun:
  # Team heads: the player UUIDs whose skins the heads of a run show, as a list. Each skin is
  # looked up once at Mojang and kept; a UUID without a skin is skipped with a warning, and
  # without any usable one the heads of palettes.head show. Example:
  #   profiles:
  #     - 069a79f4-44e9-4726-a5be-fca90e38aaf5
  #     - 61699b2e-d327-4a01-9f1e-0ea8c3f06bc6
  # An entry that is not a UUID is logged and the last valid list stays.
  heads:
    profiles: []
  # Rainbow runs: ticks (20 per second) the runner has to stand on a block before the blocks
  # change colour. A whole number above 0. Read when a run starts; an invalid edit is logged and
  # the last valid value stays.
  rainbow:
    rerollTicks: 10
  # Ultra runs: ticks the runner has to stand on a block before the blocks ahead are made anew.
  # Same rules as for Rainbow.
  ultra:
    rerollTicks: 40
  # Climbing towers: a pillar with a ladder or vine beside it, ending in a block on top. The height
  # is the rise of the top of the tower's block over the block the runner starts from, in blocks: a
  # whole number from 2 to 8, and minHeight not above maxHeight. Read when a run starts; an invalid
  # edit is logged and the last valid values stay.
  climb:
    minHeight: 3
    maxHeight: 7
  # The materials each shape of the course is shown as. Key: the block name without namespace;
  # value: its weight, a whole number of 0 or more (a weight of 3 is drawn three times as often as
  # 1; 0 switches the material off, e.g. to drop a shipped one in an override).
  # The shape sets the block state (lower half, closed, upright) and all materials of a shape must
  # collide up to the same height (heads, flower pots and candles also over the same footprint), or the start aborts naming the key. Each shape needs at least
  # one material with a weight above 0. Read when a run starts; an invalid edit is logged and the last valid palettes stay.
  palettes:
