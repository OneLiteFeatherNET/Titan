name: Build main
on:
  push:
    branches: [main]
  workflow_dispatch:

# A push to main writes the Gradle build cache that pull requests read, so this run builds
# without a path filter and runs the sweeps on all three operating systems. The job mirrors the
# build job of OneLiteFeatherNET/workflows gradle-build-pr.yml@v2.9.0: its path filter cannot run
# on push events without a checkout, which skips the build even with force-build.
concurrency:
  group: build-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    if: ${{ github.repository_owner == 'OneLiteFeatherNET' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ONELITEFEATHER_MAVEN_USERNAME: ${{ secrets.ONELITEFEATHER_MAVEN_USERNAME }}
      ONELITEFEATHER_MAVEN_PASSWORD: ${{ secrets.ONELITEFEATHER_MAVEN_PASSWORD }}
      GRADLE_OPTS: "-Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.welcome=never"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25.0.3
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25.0.3"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          add-job-summary: 'on-failure'

      - name: Run Gradle (build sweepTest)
        shell: bash
        run: |
          if [ "${RUNNER_DEBUG:-0}" = "1" ]; then
            ./gradlew build sweepTest --info --stacktrace
          else
            ./gradlew build sweepTest
          fi

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}-jdk25.0.3
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
