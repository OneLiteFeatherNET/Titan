name: Build main
on:
  push:
    branches: [main]
  workflow_dispatch:

# A push to main writes the Gradle build cache that pull requests read, so this run is forced
# (no path filter) and runs the sweeps on all three operating systems.
jobs:
  build:
    uses: OneLiteFeatherNET/workflows/.github/workflows/gradle-build-pr.yml@v2.9.0
    with:
      java-version: "25.0.3"
      java-distribution: "temurin"
      runs-on: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      gradle-task: build sweepTest
      force-build: true
    secrets: inherit
