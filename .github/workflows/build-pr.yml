name: Build PR
on:
  pull_request:

# Ubuntu runs the full build, including smokeTest (the variant scope and jar) and the Docker
# integration tests. Windows and macOS run `test` in build-pr-cross-os.yml.
jobs:
  build:
    uses: OneLiteFeatherNET/workflows/.github/workflows/gradle-build-pr.yml@v2.9.0
    with:
      java-version: "25.0.3"
      java-distribution: "temurin"
      runs-on: '["ubuntu-latest"]'
      gradle-task: build
    secrets: inherit
