# Titan lobby - shipped configuration defaults.
#
# This file ships inside the lobby's jar (on the classpath) and IS the single source of the
# defaults below - the lobby runs with these exact values even without any file at all next to the
# jar (see the lobby-module-config spec, "Ohne Konfigurationsdatei gelten die Standardwerte"). The
# build also copies it, unchanged, into the distribution as "application.example.yaml" next to the
# jar, purely so an operator has a commented copy to read; that copy is not loaded.
#
# To override a value, copy this file to "application.yaml" in the working directory next to the
# jar and keep only the keys you want to change - the lobby loads that file, plus any active
# profile's "application-<profile>.yaml", on every start, merged over the shipped defaults above.
# A key a working-directory file does not set falls back to the shipped default here, whether the
# key is entirely missing or the whole file is.
#
# Each top-level key is a module id (matching exactly one net.onelitefeather.titan.app.feature.*
# module's own configuration keys - a module only ever reads its own section, see the
# lobby-module-config spec, "Ein Modul MUSS nur seinen eigenen Abschnitt lesen können"); every
# other key inside a section is <module-id>.<field>, e.g. "spawn.minHeight". The one exception is
# "navigator.entries", where each key one level down (e.g. "survival" in
# "navigator.entries.survival.slot") is not a fixed field name but the name of one navigator entry
# - an operator can add a brand-new entry purely by adding its own map key, with no code change.
#
# Profiles: create "application-dev.yaml" (or any other profile name) with just the keys you want
# to differ for that profile, then start the lobby with the environment variable
# AVAJE_PROFILES=dev (or -Davaje.profiles=dev). A profile's file only needs to set the keys it
# changes - everything else still comes from this file.
#
# Overrides: every key can also be set via an environment variable (uppercase, "." becomes "_",
# "-" is dropped, e.g. spawn.simulationDistance -> SPAWN_SIMULATIONDISTANCE) or a system property
# (-Dspawn.simulationDistance=...). Rank order, low to high: this file < a profile's file < an
# external file selected via CONFIG_FILE < an environment variable < a system property.

# The "spawn" module: where and how a player is kept above/below the map.
spawn:
  # The lowest y coordinate a player may fall to before being teleported back to spawn.
  minHeight: -64
  # The highest y coordinate a player may rise to before being teleported back to spawn.
  maxHeight: 310
  # The simulation distance sent to a player on spawn.
  simulationDistance: 2

# The "sit" module: sitting down on an allowed block.
sit:
  # The offset from the clicked block's position to the invisible seat entity.
  offset:
    x: 0.5
    y: 0.25
    z: 0.5
  # The block keys a player may sit down on; must contain at least one entry.
  allowedBlocks:
    - minecraft:spruce_stairs

# The "tickle" module: attacking another player while holding a feather tickles them instead.
tickle:
  # How long, in milliseconds, an attacking player must wait before they can tickle again.
  cooldownMillis: 4000

# The "elytra" module: a firework-boosted rocket burn while flying.
elytra:
  # How many ticks one rocket boosts for.
  burnDurationTicks: 30
  # How many ticks after a boost starts before another may be used.
  cooldownTicks: 40

# The "navigator" module: the shared inventory every player opens from a hotbar feather, listing
# every configured destination. Each entry under "entries" is keyed by a unique name - unlike
# every other section's keys, these names are not record fields but map keys, so a profile can
# change a single entry (e.g. "navigator.entries.survival.destination") without repeating the
# others. An entry's position in the inventory comes from its own "slot", not from the order
# entries are listed here. A new destination can be added purely by adding another named entry,
# with no code change.
navigator:
  # The shared inventory's title, as a MiniMessage string.
  title: "<yellow>Navigator"
  entries:
    elytrarace:
      slot: 0
      icon: minecraft:elytra
      displayName: "<!i><gradient:#fcba03:#03fc8c>ElytraRace</gradient>"
      destination: ElytraRace
    survival:
      slot: 4
      icon: minecraft:grass_block
      displayName: "<!i><green>Survival"
      destination: Survival
    slender:
      slot: 5
      icon: minecraft:enderman_spawn_egg
      displayName: "<!i><gradient:#616161:#e80000c>Slender</gradient>"
      destination: cygnus
      # Optional: the name of a flag listed under "features" below that this entry is gated
      # behind. Omit this key entirely for an entry that is always visible.
      feature: NAVIGATOR_SLENDER
    creative:
      slot: 8
      icon: minecraft:wooden_axe
      displayName: "<!i><rainbow>Creative</rainbow>"
      destination: MemberBuild

# Feature flags: plain booleans, one per flag name, with the same sources and override order as
# every other key here (a profile's file, an external file, an environment variable such as
# "FEATURES_NAVIGATOR_SLENDER", or a system property). The names listed here - all "false" by
# default - are also the complete list of flags the lobby knows about: a navigator entry's
# "feature" key (see "navigator.entries" above) naming anything not listed here aborts startup.
features:
  NAVIGATOR_CREATIVE: false
  NAVIGATOR_SLENDER: false
  NAVIGATOR_MANIS: false
  NAVIGATOR_SURVIVAL: false
  NAVIGATOR_ELYTRA: false

# Configuration reload (see openspec/changes/config-reload-feature-flags/design.md, decision 1).
#
# avaje-config's own built-in file watcher is deliberately left off: on reload it does not
# re-apply env/system-property overrides, leaves a deleted key in place, never notices a newly
# created file, and partially applies a change if one of several files is broken. The lobby's own
# reloader (the "/titanreload" command, and this file's own polling below) rebuilds the whole
# configuration through the same pipeline used on startup instead, so overrides, deleted keys and
# new files all behave exactly like a fresh start, and a broken file changes nothing at all.
config.watch.enabled: false

# How often, in seconds, the lobby polls application.{yaml,yml,properties} (base and per active
# profile) plus CONFIG_FILE/config.file for changes and triggers a reload if one is found. Read
# once at startup; "0" turns polling off entirely (the "/titanreload" command still works either
# way). Commented out here since 10 is already the lobby's own built-in default - uncomment only
# to change it.
# titan.config.reload.intervalSeconds: 10
